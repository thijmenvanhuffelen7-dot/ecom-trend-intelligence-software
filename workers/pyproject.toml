[project]
name = "trendscope-workers"
version = "0.1.0"
description = "Data-ingestie, verrijking, scoring en alerts voor Trendscope"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "clickhouse-connect>=0.8",
  "celery[redis]>=5.4",
  "pyyaml>=6.0",
  "numpy>=2.0",
  "structlog>=24.4",
  "boto3>=1.44.7",
  "playwright>=1.65.2",
  "pillow>=11",
  "cryptography>=44",
]

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.21", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
trendscope = "trendscope.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trendscope"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# De formatter bewaakt de regellengte van code; lange SQL- en HTML-strings laat hij (terecht) heel.
# Ruff raadt E501 af in combinatie met `ruff format`.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/trendscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: vereist draaiende Postgres/ClickHouse (make dev-services)"]

[[tool.mypy.overrides]]
# Celery heeft geen type-informatie voor zijn decorators
module = "trendscope.worker.*"
disallow_untyped_decorators = false
