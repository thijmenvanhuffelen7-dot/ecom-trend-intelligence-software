# Lokale ontwikkelomgeving: alle datastores. Start met `make dev-services`.
name: trendscope

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trendscope
      POSTGRES_PASSWORD: trendscope
      POSTGRES_DB: trendscope
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendscope"]
      interval: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: trendscope
      CLICKHOUSE_PASSWORD: trendscope
      CLICKHOUSE_DB: trendscope
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["8123:8123", "9000:9000"]
    volumes: [ch-data:/var/lib/clickhouse]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: dev-master-key
      MEILI_NO_ANALYTICS: "true"
    ports: ["7700:7700"]
    volumes: [meili-data:/meili_data]

  minio:
    # Docker Hub publiceert geen MinIO-images meer; de officiële registry is quay.io
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9002:9000", "9001:9001"]
    volumes: [minio-data:/data]

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

volumes:
  pg-data:
  ch-data:
  meili-data:
  minio-data:
